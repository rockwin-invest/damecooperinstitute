<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="damecooper-official-favicon.webp">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password | DameCooper Institute</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#10243a" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #10243a; --navy-deep: #091827; --navy-mid: #1a3554;
      --gold: #b69a59; --gold-dark: #987b40; --gold-light: #d4bc85;
      --ivory: #f7f5ef; --white: #ffffff;
      --text-main: #202a35; --text-secondary: #66717d; --neutral: #edf1f5;
      --success: #2e7d5b; --success-bg: #e8f4ee;
      --danger: #b23a3a; --danger-bg: #fbeaea;
      --info: #315c76; --info-bg: #e8f0f6;
      --border-thin: rgba(16,36,58,0.08);
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --radius: 2px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans); color: var(--text-main); line-height: 1.6;
      background:
        radial-gradient(circle at 20% 20%, rgba(182,154,89,0.12), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(49,92,118,0.15), transparent 40%),
        linear-gradient(135deg, var(--navy-deep) 0%, var(--navy-mid) 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 40px 20px; -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-family: var(--font-serif); font-weight: 600; line-height: 1.2; }
    p { color: var(--text-secondary); }
    a { color: inherit; text-decoration: none; transition: var(--transition); }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--gold); outline-offset: 2px; border-radius: var(--radius);
    }

    .card {
      background-color: var(--white); width: 100%; max-width: 460px;
      padding: 44px 40px 36px; border-radius: var(--radius);
      box-shadow: 0 40px 80px -24px rgba(9,24,39,0.45); position: relative;
    }
    .card::before {
      content: ""; position: absolute; top: 0; left: 0;
      width: 64px; height: 4px; background-color: var(--gold);
    }
    .brand-lockup { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .mark {
      width: 44px; height: 44px; display: inline-flex; align-items: center;
      justify-content: center; background-color: var(--navy); color: var(--gold);
      font-family: var(--font-serif); font-weight: 700; font-size: 1rem;
      border-radius: var(--radius); position: relative; flex-shrink: 0;
    }
    .mark::after { content: ""; position: absolute; inset: 4px; border: 1px solid rgba(182,154,89,0.4); border-radius: 1px; }
    .brand-text strong { display: block; font-family: var(--font-serif); font-size: 1.0625rem; color: var(--navy); line-height: 1.1; }
    .brand-text span { display: block; font-size: 0.6875rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-secondary); margin-top: 3px; }
    .card h2 { font-size: 1.75rem; color: var(--navy); margin-bottom: 8px; }
    .card > p { font-size: 0.9375rem; margin-bottom: 26px; line-height: 1.65; }

    .msg { display: none; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: var(--radius); font-size: 0.8125rem; line-height: 1.55; margin-bottom: 20px; }
    .msg.show { display: flex; }
    .msg i { flex-shrink: 0; margin-top: 2px; font-size: 0.875rem; }
    .msg.error { background-color: var(--danger-bg); color: var(--danger); border-left: 3px solid var(--danger); }
    .msg.success { background-color: var(--success-bg); color: var(--success); border-left: 3px solid var(--success); }
    .msg.info { background-color: var(--info-bg); color: var(--info); border-left: 3px solid var(--info); }

    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .field label { font-size: 0.8125rem; font-weight: 600; color: var(--navy); }
    .field label .req { color: var(--gold-dark); }
    .field-input { position: relative; }
    .field-input input {
      width: 100%; font-family: inherit; font-size: 0.9375rem; color: var(--text-main);
      background-color: var(--white); border: 1px solid var(--border-thin);
      border-radius: var(--radius); padding: 13px 44px 13px 14px; transition: var(--transition);
    }
    .field-input input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(182,154,89,0.14); }
    .field-input input.invalid { border-color: var(--danger); }
    .field-toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 34px; height: 34px; display: inline-flex; align-items: center;
      justify-content: center; color: var(--text-secondary); border-radius: var(--radius);
      transition: var(--transition); font-size: 0.875rem;
    }
    .field-toggle:hover { color: var(--navy); background-color: var(--neutral); }
    .field-error {
      display: none; font-size: 0.75rem; color: var(--danger);
      line-height: 1.5; align-items: center; gap: 6px; margin-top: 2px;
    }
    .field-error.show { display: flex; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 10px; padding: 15px 26px; font-family: inherit; font-size: 0.9375rem;
      font-weight: 600; letter-spacing: 0.01em; border-radius: var(--radius);
      transition: var(--transition); cursor: pointer; border: 1px solid transparent;
      white-space: nowrap; width: 100%;
    }
    .btn-gold { background-color: var(--gold); color: var(--navy-deep); }
    .btn-gold:hover:not(:disabled) { background-color: var(--gold-dark); color: var(--white); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn i.fa-circle-notch { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .card-foot { padding-top: 22px; border-top: 1px solid var(--border-thin); font-size: 0.75rem; color: var(--text-secondary); text-align: center; }
    .card-foot a { color: var(--gold-dark); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>

  <main class="card" aria-labelledby="resetTitle">
    <div class="brand-lockup">
      <span class="mark" aria-hidden="true">DC</span>
      <span class="brand-text">
        <strong>DameCooper</strong>
        <span>Institute of Higher Learning</span>
      </span>
    </div>

    <h2 id="resetTitle">Choose a new password</h2>
    <p id="resetLede">Verifying your reset link…</p>

    <div class="msg" id="msg" role="alert" aria-live="polite">
      <i class="fas fa-circle-info" id="msgIcon" aria-hidden="true"></i>
      <span id="msgText"></span>
    </div>

    <div class="info-note" id="accountSummary" style="display:none;padding:14px 16px;background:var(--ivory);border-radius:var(--radius);font-size:0.8125rem;line-height:1.6;color:var(--text-secondary);margin-bottom:22px;">
      <strong id="summaryName" style="color:var(--navy);display:block;margin-bottom:2px;">—</strong>
      <span id="summaryEmail">—</span>
    </div>

    <form id="resetForm" novalidate style="display:none;">
      <div class="field">
        <label for="newPassword">
          New password <span class="req">*</span>
        </label>
        <span class="field-input">
          <input type="password" id="newPassword" autocomplete="new-password" required minlength="8" />
          <button type="button" class="field-toggle" id="toggleNew" aria-label="Show password">
            <i class="fas fa-eye" aria-hidden="true"></i>
          </button>
        </span>
        <span class="field-error" id="newPasswordError" role="alert">
          <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
          <span>Password must be at least 8 characters.</span>
        </span>
      </div>

      <div class="field">
        <label for="confirmPassword">
          Confirm password <span class="req">*</span>
        </label>
        <span class="field-input">
          <input type="password" id="confirmPassword" autocomplete="new-password" required />
          <button type="button" class="field-toggle" id="toggleConfirm" aria-label="Show password">
            <i class="fas fa-eye" aria-hidden="true"></i>
          </button>
        </span>
        <span class="field-error" id="confirmPasswordError" role="alert">
          <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
          <span>Passwords do not match.</span>
        </span>
      </div>

      <button type="submit" class="btn btn-gold" id="submitBtn">
        Set new password
        <i class="fas fa-arrow-right" aria-hidden="true"></i>
      </button>
    </form>

    <div class="card-foot" id="cardFoot">
      Remembered it? <a href="signin.html">Back to sign in</a>
    </div>
  </main>

  <script>
    /* ============================================================
       RESET PASSWORD PAGE
       ============================================================ */
    const API_BASE = "https://damecooperinstitute.onrender.com/api";
    const state = { token: null };

    const dom = {
      lede: document.getElementById("resetLede"),
      msg: document.getElementById("msg"),
      msgIcon: document.getElementById("msgIcon"),
      msgText: document.getElementById("msgText"),
      summary: document.getElementById("accountSummary"),
      summaryName: document.getElementById("summaryName"),
      summaryEmail: document.getElementById("summaryEmail"),
      form: document.getElementById("resetForm"),
      newPassword: document.getElementById("newPassword"),
      confirmPassword: document.getElementById("confirmPassword"),
      toggleNew: document.getElementById("toggleNew"),
      toggleConfirm: document.getElementById("toggleConfirm"),
      newPasswordError: document.getElementById("newPasswordError"),
      confirmPasswordError: document.getElementById("confirmPasswordError"),
      submitBtn: document.getElementById("submitBtn"),
      cardFoot: document.getElementById("cardFoot")
    };

    function showMessage(kind, text) {
      dom.msg.className = "msg show " + kind;
      dom.msgText.textContent = text;
      dom.msgIcon.className = "fas " + (
        kind === "error" ? "fa-circle-exclamation" :
        kind === "success" ? "fa-circle-check" :
        "fa-circle-info"
      );
    }

    function setFieldError(field, errorEl, message) {
      if (message) {
        field.classList.add("invalid");
        errorEl.querySelector("span").textContent = message;
        errorEl.classList.add("show");
      } else {
        field.classList.remove("invalid");
        errorEl.classList.remove("show");
      }
    }

    function setLoading(button, isLoading, label) {
      if (!button.dataset.originalHtml) button.dataset.originalHtml = button.innerHTML;
      if (isLoading) {
        button.disabled = true;
        button.innerHTML = (label || "Please wait") + ' <i class="fas fa-circle-notch" aria-hidden="true"></i>';
      } else {
        button.disabled = false;
        button.innerHTML = button.dataset.originalHtml;
      }
    }

    async function verifyToken() {
      const params = new URLSearchParams(window.location.search);
      state.token = params.get("token");

      if (!state.token) {
        showMessage("error", "This page needs a reset link. Please request one from the sign-in page.");
        dom.lede.textContent = "Missing reset token";
        dom.cardFoot.style.display = "none";
        return;
      }

      try {
        const res = await fetch(API_BASE + "/auth/verify-reset-token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: state.token })
        });
        const data = await res.json();

        if (!res.ok) {
          showMessage("error", data.message || "This reset link is invalid or has expired.");
          dom.lede.textContent = "We can't verify this link";
          dom.cardFoot.style.display = "none";
          return;
        }

        dom.lede.textContent = "Welcome back, " + data.user.firstName + ". Choose a new password.";
        dom.summaryName.textContent = data.user.firstName;
        dom.summaryEmail.textContent = data.user.email;
        dom.summary.style.display = "";
        dom.form.style.display = "";
        setTimeout(() => dom.newPassword.focus(), 100);
      } catch (err) {
        showMessage("error", "We couldn't reach the server. Please try again.");
        dom.lede.textContent = "Something went wrong";
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const pw = dom.newPassword.value;
      const confirm = dom.confirmPassword.value;

      let valid = true;
      if (!pw || pw.length < 8) {
        setFieldError(dom.newPassword, dom.newPasswordError, "Password must be at least 8 characters.");
        valid = false;
      } else {
        setFieldError(dom.newPassword, dom.newPasswordError, null);
      }
      if (pw !== confirm) {
        setFieldError(dom.confirmPassword, dom.confirmPasswordError, "Passwords do not match.");
        valid = false;
      } else {
        setFieldError(dom.confirmPassword, dom.confirmPasswordError, null);
      }
      if (!valid) return;

      setLoading(dom.submitBtn, true, "Saving");

      try {
        const res = await fetch(API_BASE + "/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: state.token, password: pw })
        });
        const data = await res.json();

        if (!res.ok) {
          showMessage("error", data.message || "We couldn't reset your password.");
          setLoading(dom.submitBtn, false);
          return;
        }

        showMessage("success", "Password updated. Redirecting to sign-in…");
        dom.form.style.display = "none";
        dom.summary.style.display = "none";
        setTimeout(() => { window.location.href = "signin.html"; }, 1200);
      } catch (err) {
        showMessage("error", "We couldn't reach the server. Please try again.");
        setLoading(dom.submitBtn, false);
      }
    }

    dom.toggleNew.addEventListener("click", function () {
      const isPw = dom.newPassword.type === "password";
      dom.newPassword.type = isPw ? "text" : "password";
      this.querySelector("i").className = isPw ? "fas fa-eye-slash" : "fas fa-eye";
    });

    dom.toggleConfirm.addEventListener("click", function () {
      const isPw = dom.confirmPassword.type === "password";
      dom.confirmPassword.type = isPw ? "text" : "password";
      this.querySelector("i").className = isPw ? "fas fa-eye-slash" : "fas fa-eye";
    });

    dom.form.addEventListener("submit", handleSubmit);

    document.addEventListener("DOMContentLoaded", verifyToken);
  </script>
</body>
</html>
